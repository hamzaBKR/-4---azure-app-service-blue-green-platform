<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ name }}</title>
  <style>
    body{font-family:Arial,sans-serif;margin:0;background:#f4f7fb;color:#162033}
    main{max-width:760px;margin:70px auto;padding:32px;background:white;border-radius:14px;
         box-shadow:0 10px 30px rgba(0,0,0,.08)}
    .status{display:inline-block;padding:7px 12px;border-radius:999px;background:#e7f7ed;
            color:#176b36;font-weight:700}
    dl{display:grid;grid-template-columns:180px 1fr;gap:14px;margin-top:28px}
    dt{font-weight:700} dd{margin:0}
    code{background:#eef2f7;padding:3px 6px;border-radius:5px}
  </style>
</head>
<body>
<main>
  <span class="status">Healthy</span>
  <h1>{{ name }}</h1>
  <p>Azure App Service portfolio project.</p>
  <dl>
    <dt>Version</dt><dd><code>{{ version }}</code></dd>
    <dt>Environment</dt><dd><code>{{ environment }}</code></dd>
    <dt>Deployment time</dt><dd><code>{{ deployment_time }}</code></dd>
    <dt>Health endpoint</dt><dd><code>/health</code></dd>
  </dl>
</main>
</body>
</html>
