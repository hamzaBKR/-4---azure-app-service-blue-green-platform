name: Azure Infrastructure

# This workflow runs only when you start it manually.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Preview changes or deploy resources
        required: true
        type: choice
        options:
          - preview
          - deploy
        default: preview

      name_prefix:
        description: Globally unique prefix for Azure resource names
        required: true
        type: string
        default: hamza204demo

      sku_name:
        description: App Service Plan SKU
        required: true
        type: choice
        options:
          - B1
          - S1
          - P1v3
        default: B1

      environment_name:
        description: Deployment environment
        required: true
        type: choice
        options:
          - development
          - test
          - production
        default: development

# id-token: write allows GitHub to request the OIDC token.
# contents: read allows the workflow to read repository files.
permissions:
  id-token: write
  contents: read

jobs:
  infrastructure:
    name: ${{ inputs.operation }} infrastructure
    runs-on: ubuntu-latest

    # Must match the GitHub environment and Azure federated credential.
    environment: development

    steps:
      # Download the repository files to the GitHub runner.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Authenticate to Azure using the passwordless OIDC connection
      # that we previously configured.
      - name: Log in to Azure using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Confirm that the workflow is using the expected Azure account.
      - name: Display Azure context
        run: |
          az account show \
            --query "{subscription:name, subscriptionId:id, tenantId:tenantId}" \
            --output table
            
      # Fail immediately if the GitHub variable is missing.
      - name: Check deployment configuration
        run: |
          echo "Resource Group = '${{ vars.AZURE_RESOURCE_GROUP }}'"

          if [ -z "${{ vars.AZURE_RESOURCE_GROUP }}" ]; then
            echo "ERROR: AZURE_RESOURCE_GROUP GitHub variable is empty."
            exit 1
          fi

      # Confirm that our least-privilege target Resource Group exists
      # and that the GitHub identity can access it.
      - name: Verify target Resource Group
        run: |
          az group show \
            --name "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --query "{name:name, location:location, provisioningState:properties.provisioningState}" \
            --output table

      # Compile the Bicep source into an ARM JSON template.
      # This catches Bicep syntax and compilation problems.
      - name: Build Bicep template
        run: |
          az bicep build \
            --file infrastructure/main.bicep \
            --stdout > /tmp/main.json

      # Ask Azure Resource Manager whether the deployment is valid.
      # This does not create the resources.
      - name: Validate infrastructure
        run: |
          az deployment group validate \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters \
              namePrefix="${{ inputs.name_prefix }}" \
              skuName="${{ inputs.sku_name }}" \
              environmentName="${{ inputs.environment_name }}" \
            --output none

      # Show exactly what Azure predicts it would create or change.
      # This still does not deploy the resources.
      - name: Preview infrastructure changes
        run: |
          az deployment group what-if \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters \
              namePrefix="${{ inputs.name_prefix }}" \
              skuName="${{ inputs.sku_name }}" \
              environmentName="${{ inputs.environment_name }}"

      # This step runs only when you selected "deploy".
      # This is the first step that creates billable Azure resources.
      - name: Deploy infrastructure
        if: ${{ inputs.operation == 'deploy' }}
        run: |
          az deployment group create \
            --name "appservice-${{ github.run_number }}" \
            --resource-group "${{ vars.AZURE_RESOURCE_GROUP }}" \
            --template-file infrastructure/main.bicep \
            --parameters \
              namePrefix="${{ inputs.name_prefix }}" \
              skuName="${{ inputs.sku_name }}" \
              environmentName="${{ inputs.environment_name }}" \
            --query properties.outputs \
            --output json | tee deployment-outputs.json

      # Add important deployment information to the GitHub run summary.
      - name: Publish deployment summary
        if: ${{ inputs.operation == 'deploy' }}
        run: |
          echo "## Azure infrastructure deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Resource Group:** ${{ vars.AZURE_RESOURCE_GROUP }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** ${{ inputs.environment_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "**SKU:** ${{ inputs.sku_name }}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```json' >> "$GITHUB_STEP_SUMMARY"
          cat deployment-outputs.json >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"